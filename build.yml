name: Build Universal APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android Build Tools
        uses: android-actions/setup-android@v3

      - name: Fetch Clean SDL3 Framework
        run: |
          curl -L "https://github.com" -o framework.zip
          unzip -q framework.zip
          mv SDL-* SDL
          mkdir -p SDL/android-project/app/src/main/jni/src
          cp reallyfinalfallball294.cpp SDL/android-project/app/src/main/jni/src/main.cpp

      - name: Configure Android Project
        run: |
          cd SDL/android-project
          echo "ndk.dir=$ANDROID_NDK_ROOT" > local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

      - name: Compile APK via Gradle
        run: |
          cd SDL/android-project
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Export Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: SDL/android-project/app/build/outputs/apk/debug/app-debug.apk
