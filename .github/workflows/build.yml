name: Build Universal APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Fetch Framework and Build APK inside Container
        uses: docker://mobiledevops/android-sdk-image:34.0.0
        with:
          args: >
            bash -c "
            curl -L \"https://github.com\" -o framework.zip &&
            unzip -q framework.zip &&
            mv SDL-* SDL &&
            mkdir -p SDL/android-project/app/src/main/jni/src &&
            cp reallyfinalfallball294.cpp SDL/android-project/app/src/main/jni/src/main.cpp &&
            cd SDL/android-project &&
            chmod +x gradlew &&
            ./gradlew assembleDebug
            "
          
      - name: Export Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: SDL/android-project/app/build/outputs/apk/debug/app-debug.apk
