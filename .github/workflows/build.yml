name: Build Universal APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout Stable SDL Framework
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-2.30.x
          path: SDL

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare C++ Source File
        run: |
          mkdir -p SDL/android-project/app/src/main/jni/src
          cp main-repo/reallyfinalfallball294.cpp SDL/android-project/app/src/main/jni/src/main.cpp

      - name: Configure Android Project
        run: |
          cd SDL/android-project
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_LATEST_HOME" >> local.properties

      - name: Compile APK via Gradle
        env:
          APP_ALLOW_MISSING_DEPS: true
        run: |
          cd SDL/android-project
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Export Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: SDL/android-project/app/build/outputs/apk/debug/app-debug.apk
